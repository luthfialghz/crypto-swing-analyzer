version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - GEMINI_API_KEY=${GEMINI_API_KEY}
        - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
        - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
    volumes:
      # Mount data directory for portfolio persistence
      - ./data:/app/data
      # Only mount .env.local if it exists, otherwise skip
      # Comment out the .env.local mount to avoid conflicts during build
      # - ./.env.local:/app/.env.local:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://163.61.58.197:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Add resource limits to prevent build issues
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    environment:
      - API_URL=http://app:3000/api/daily-scheduler
      - TZ=Asia/Jakarta
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

